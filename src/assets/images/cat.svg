<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 고양이 몸통 -->
  <ellipse cx="100" cy="130" rx="45" ry="40" fill="#ff9a56"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="70" r="40" fill="#ff9a56"/>

  <!-- 왼쪽 귀 -->
  <polygon points="65,45 75,15 90,40" fill="#ff9a56"/>
  <polygon points="70,42 77,22 85,40" fill="#ffb6c1"/>

  <!-- 오른쪽 귀 -->
  <polygon points="135,45 125,15 110,40" fill="#ff9a56"/>
  <polygon points="130,42 123,22 115,40" fill="#ffb6c1"/>

  <!-- 왼쪽 눈 -->
  <ellipse cx="82" cy="65" rx="10" ry="12" fill="white"/>
  <circle cx="84" cy="67" r="6" fill="#333"/>
  <circle cx="86" cy="64" r="2" fill="white"/>

  <!-- 오른쪽 눈 -->
  <ellipse cx="118" cy="65" rx="10" ry="12" fill="white"/>
  <circle cx="116" cy="67" r="6" fill="#333"/>
  <circle cx="114" cy="64" r="2" fill="white"/>

  <!-- 코 -->
  <ellipse cx="100" cy="82" rx="5" ry="4" fill="#ff6b9d"/>

  <!-- 입 -->
  <path d="M92,88 Q100,95 108,88" stroke="#333" stroke-width="2" fill="none"/>

  <!-- 수염 왼쪽 -->
  <line x1="55" y1="75" x2="78" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="82" x2="78" y2="82" stroke="#333" stroke-width="1.5"/>
  <line x1="55" y1="89" x2="78" y2="84" stroke="#333" stroke-width="1.5"/>

  <!-- 수염 오른쪽 -->
  <line x1="145" y1="75" x2="122" y2="80" stroke="#333" stroke-width="1.5"/>
  <line x1="145" y1="82" x2="122" y2="82" stroke="#333" stroke-width="1.5"/>
  <line x1="145" y1="89" x2="122" y2="84" stroke="#333" stroke-width="1.5"/>

  <!-- 왼쪽 앞발 -->
  <ellipse cx="70" cy="165" rx="12" ry="15" fill="#ff9a56"/>
  <ellipse cx="65" cy="175" rx="4" ry="3" fill="#ffb6c1"/>
  <ellipse cx="70" cy="177" rx="4" ry="3" fill="#ffb6c1"/>
  <ellipse cx="75" cy="175" rx="4" ry="3" fill="#ffb6c1"/>

  <!-- 오른쪽 앞발 -->
  <ellipse cx="130" cy="165" rx="12" ry="15" fill="#ff9a56"/>
  <ellipse cx="125" cy="175" rx="4" ry="3" fill="#ffb6c1"/>
  <ellipse cx="130" cy="177" rx="4" ry="3" fill="#ffb6c1"/>
  <ellipse cx="135" cy="175" rx="4" ry="3" fill="#ffb6c1"/>

  <!-- 꼬리 -->
  <path d="M145,130 Q170,110 165,80 Q160,60 175,50" stroke="#ff9a56" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- 볼 터치 -->
  <circle cx="65" cy="80" r="8" fill="#ffb6c1" opacity="0.6"/>
  <circle cx="135" cy="80" r="8" fill="#ffb6c1" opacity="0.6"/>
</svg>
